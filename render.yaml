databases:
  - name: voyagemind-db
    databaseName: voyagemind
    user: voyage
    plan: free

services:
  # 1. Travel MCP Gateway (Docker Web Service)
  - type: web
    name: voyagemind-mcp
    runtime: docker
    dockerfilePath: ./travel-mcp-server/Dockerfile
    dockerContext: ./travel-mcp-server
    plan: free
    envVars:
      - key: PORT
        value: 8001
      - key: MCP_PORT
        value: 8001
      - key: SERPAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # 2. VoyageMind Backend (Docker Web Service)
  - type: web
    name: voyagemind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: voyagemind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: TRAVEL_MCP_URL
        value: http://voyagemind-mcp:8001
      - key: CORS_ORIGINS
        sync: false
